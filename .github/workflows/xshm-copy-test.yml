name: XCB presentation probe tests
on:
  push:
    branches: [ds3-xshm-copy-probe]
    paths: [tools/xshm-copy/**, tools/present-copy/**, tools/sync-wait/**, .github/workflows/xshm-copy-test.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y gcc pkg-config libdrm-dev libxcb1-dev libxcb-shm0-dev libxcb-present-dev xvfb xauth
      - name: Producer fence-wait ABI and sanitizer checks
        run: |
          bash tools/sync-wait/build-test.sh "$RUNNER_TEMP/sync-wait"
          SANITIZE=address,undefined ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1 \
            bash tools/sync-wait/build-test.sh "$RUNNER_TEMP/sync-wait-asan"
      - name: Present COPY ABI and sanitizer checks
        run: |
          bash tools/present-copy/build-test.sh "$RUNNER_TEMP/present-copy"
          SANITIZE=address,undefined ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1 \
            bash tools/present-copy/build-test.sh "$RUNNER_TEMP/present-copy-asan"
      - name: Pixel equality and sanitizer checks
        run: |
          set -euo pipefail
          cd tools/xshm-copy
          cc -std=gnu11 -Wall -Wextra -Werror -O2 -fPIC -shared xshm-copy.c -o libxshm.so -lxcb -lxcb-shm -ldl -pthread
          cc -std=gnu11 -Wall -Wextra -Werror -O2 pixel-test.c -o pixel-test -lxcb -pthread
          xvfb-run -a ./pixel-test
          xvfb-run -a env LD_PRELOAD="$PWD/libxshm.so" ./pixel-test
          xvfb-run -a env ANLAND_XSHM_DISABLE=1 LD_PRELOAD="$PWD/libxshm.so" ./pixel-test
          cc -std=gnu11 -Wall -Wextra -Werror -O1 -g -fPIC -shared -fsanitize=address,undefined xshm-copy.c -o libxshm-asan.so -lxcb -lxcb-shm -ldl -pthread
          cc -std=gnu11 -Wall -Wextra -Werror -O1 -g -fsanitize=address,undefined pixel-test.c -o pixel-test-asan -lxcb -pthread
          xvfb-run -a env LD_PRELOAD="$(cc -print-file-name=libasan.so):$PWD/libxshm-asan.so" ./pixel-test-asan
