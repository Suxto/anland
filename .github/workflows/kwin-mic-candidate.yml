name: KWin microphone candidate

on:
  workflow_dispatch:
  push:
    branches: [mic-ondemand-parallel]
    paths: [.github/workflows/kwin-mic-candidate.yml]

permissions:
  contents: read

jobs:
  kwin:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build native Arch package (no installation on device)
        env:
          IMAGE: ogarcia/archlinux@sha256:26d1016f2c1ce083917cbc42608127747b0c2d81bc24807e681beb64c61b542c
        run: |
          set -euo pipefail
          mkdir -p kwin-output
          docker run --rm -i --platform linux/arm64 \
            -e SOURCE_COMMIT="$GITHUB_SHA" \
            -v "$PWD:/source:ro" -v "$PWD/kwin-output:/out" "$IMAGE" bash -s <<'BUILD'
          set -euo pipefail
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed base-devel git ca-certificates sudo
          useradd -m -s /bin/bash anland
          printf 'anland ALL=(root) NOPASSWD: /usr/bin/pacman\n' > /etc/sudoers.d/anland-pacman
          chmod 0440 /etc/sudoers.d/anland-pacman
          printf "PKGEXT='.pkg.tar.zst'\nPACMAN_AUTH=(sudo)\n" > /home/anland/.makepkg.conf
          cp -a /source /tmp/anland
          # This is the same public-header correction used by the stock package CI.
          backend=/tmp/anland/producers/kde/Arch_v5/kwin/src/backends/anland
          find "$backend" -maxdepth 1 -type f -name '*.h' -exec sed -i \
            -e 's@#include "display_producer.h"@#include "libdisplay_producer/display_producer.h"@' \
            -e 's@#include "protocol.h"@#include "libdisplay_producer/protocol.h"@' {} +
          recipe=/tmp/anland/producers/kde/Arch_v5/PKGBUILD
          grep -Fx 'pkgver=6.8.0' "$recipe"
          grep -Fx 'pkgrel=1.1' "$recipe"
          sed -i 's/^pkgrel=1.1$/pkgrel=1.2/' "$recipe"
          chown -R anland:anland /tmp/anland /out /home/anland/.makepkg.conf
          cd /tmp/anland/producers/kde/Arch_v5
          sudo -u anland env HOME=/home/anland JOBS=4 BUILD_XWAYLAND=0 \
            ANLAND_INSTALL=0 WORKDIR=/out/work ./build.sh --noconfirm
          cd /tmp/anland
          sudo -u anland env PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests/audio -v
          pkg=/out/work/packages/kwin-6.8.0-1.2-aarch64.pkg.tar.zst
          test -s "$pkg"
          test "$(pacman -Qp "$pkg")" = 'kwin 6.8.0-1.2'
          cp "$pkg" /out/test.pkg.tar.zst
          printf 'source_commit=%s\nkwin=6.8.0-1.2\narch=aarch64\nmic_capture_lease_ms=1000\nxwayland=reused\ndevice_validation=not-tested\n' \
            "$SOURCE_COMMIT" > /out/source-manifest.txt
          cd /out
          sha256sum test.pkg.tar.zst > SHA256SUMS
          BUILD
      - uses: actions/upload-artifact@v7
        with:
          name: kwin-mic-arm64-candidate
          path: |
            kwin-output/test.pkg.tar.zst
            kwin-output/SHA256SUMS
            kwin-output/source-manifest.txt
          if-no-files-found: error
