name: Private KGSL implicit-sync diagnostic
on:
  workflow_dispatch:
  push:
    branches: [ds3-xshm-copy-probe]
    paths: ['tools/kgsl-sync/**', '.github/workflows/kgsl-sync-test.yml']
permissions:
  contents: read
jobs:
  native-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    container: debian:trixie-slim
    steps:
      - uses: actions/checkout@v7
      - name: Build dependencies (CI container only)
        run: |
          apt-get update
          apt-get install -y ca-certificates curl patch gcc g++ meson ninja-build pkg-config python3-mako python3-ply python3-yaml bison flex libdrm-dev libelf-dev libexpat1-dev libzstd-dev zlib1g-dev libx11-dev libxext-dev libxfixes-dev libxrandr-dev libxcb-dri2-0-dev libxcb-dri3-dev libxcb-present-dev libxcb-xfixes0-dev libxshmfence-dev libxxf86vm-dev libwayland-dev wayland-protocols libglvnd-dev
      - name: Fetch pinned source, apply diagnostic and test/build
        run: |
          curl -fLsS --max-time 120 https://codeload.github.com/lfdevs/mesa-for-android-container/tar.gz/98f3d6229d61452cef80f8563af7c56ae599dc14 -o /tmp/mesa.tar.gz
          echo '5211bd235658a0585740fb2dfbe64e7e8ca3085ad8e423fc333b4d5e0de6fd93  /tmp/mesa.tar.gz' | sha256sum -c -
          mkdir /tmp/mesa
          tar -xzf /tmp/mesa.tar.gz -C /tmp/mesa --strip-components=1
          sh tools/kgsl-sync/build.sh /tmp/mesa
      - uses: actions/upload-artifact@v7
        with:
          name: private-kgsl-arm64
          path: tools/kgsl-sync/artifact/
